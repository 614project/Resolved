name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈 태그 (예: v0.1)'
        required: false
        default: 'v0.1'
      publish_release:
        description: 'GitHub Release 발행 여부'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build win-x64
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG
          }
          else {
            $tag = 'v0.1'
          }

          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "'$tag' is not a valid release version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Publish (Self-contained, unpackaged win-x64)
        run: >-
          dotnet publish Resolved.csproj
          --configuration Release
          --output publish/win-x64
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -p:AppxPackageSigningEnabled=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:SourceRevisionId=${{ github.sha }}

      - name: Package
        shell: pwsh
        run: |
          foreach ($required in 'Resolved.exe', 'resources.pri', 'Assets/Fonts/Outfit.ttf', 'Assets/Fonts/SUIT.ttf') {
            if (-not (Test-Path (Join-Path 'publish/win-x64' $required))) {
              throw "The publish output does not contain $required."
            }
          }

          $name = "Resolved-${{ steps.version.outputs.version }}-win-x64"
          $staging = Join-Path 'dist' $name
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path 'publish/win-x64/*' -Destination $staging -Recurse
          Get-ChildItem -Path $staging -Recurse -Filter '*.pdb' | Remove-Item

          $zip = "dist/$name.zip"
          Compress-Archive -Path $staging -DestinationPath $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $name.zip" -Encoding ascii
          Remove-Item -Path $staging -Recurse

          Get-ChildItem -Path dist | Format-Table Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Resolved-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: Resolved-win-x64
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "resolved.ce $VERSION" \
            --notes "Windows 10 (1809) 이상 64비트(x64)용 포터블 릴리즈입니다. 압축을 풀고 \`Resolved.exe\`를 실행하면 별도 런타임이나 설치 없이 바로 사용할 수 있습니다." \
            --generate-notes \
            "${flags[@]}"
